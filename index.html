 .name-label:before{display:none}
 @media (max-width:760px){#app{flex-direction:column}#side{width:100%;min-width:0;height:42%;border-right:0;border-bottom:1px solid var(--line)}}

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

const map = L.map("map", {zoomControl:true}).setView([36.4, 127.8], 7);
const vBase = L.tileLayer("https://api.vworld.kr/req/wmts/1.0.0/"+KEY+"/Base/{z}/{y}/{x}.png",
  {minZoom:6, maxZoom:19, attribution:"&copy; 국토교통부 브이월드"});
const vSat = L.tileLayer("https://api.vworld.kr/req/wmts/1.0.0/"+KEY+"/Satellite/{z}/{y}/{x}.jpeg",
  {minZoom:6, maxZoom:19, attribution:"&copy; 국토교통부 브이월드"});
const vHyb = L.tileLayer("https://api.vworld.kr/req/wmts/1.0.0/"+KEY+"/Hybrid/{z}/{y}/{x}.png", {minZoom:6, maxZoom:19});
const osm = L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
  {maxZoom:19, attribution:"&copy; OpenStreetMap"});
vBase.addTo(map);
let tileFail = 0;
vBase.on("tileerror", () => { if (++tileFail === 6 && map.hasLayer(vBase)) {
  map.removeLayer(vBase); osm.addTo(map);
  console.warn("브이월드 지도를 못 불러와서 오픈스트리트맵으로 바꿨어요. 키/도메인 설정을 확인하세요."); }});
L.control.layers({"브이월드 일반":vBase, "브이월드 위성":L.layerGroup([vSat, vHyb]), "오픈스트리트맵":osm}).addTo(map);

const cluster = L.markerClusterGroup({showCoverageOnHover:false, maxClusterRadius:45});
map.addLayer(cluster);
const LABEL_ZOOM = 13;

function popupHtml(b, list){
  const cos = list.map(c => `
   <div class="co"><h3>${esc(c["기업명"])}</h3><table>
    <tr><td>산업군</td><td>${esc(c["산업군"])}</td></tr>
    <tr><td>기업규모</td><td>${esc(c["기업규모"])}</td></tr>
    <tr><td>DART 회사명</td><td>${esc(c["DART 회사명"])}</td></tr>
    <tr><td>지도 위치</td><td>${esc(b.address)}</td></tr>
    ${c["DART 원래 주소"] ? `<tr><td>DART 주소</td><td>${esc(c["DART 원래 주소"])}</td></tr>` : ""}
    ${c["같은 회사 다른 표기"] ? `<tr><td>다른 표기</td><td>${esc(c["같은 회사 다른 표기"])}</td></tr>` : ""}
   </table>
   <div class="links">
    <a target="_blank" href="https://search.naver.com/search.naver?query=${encodeURIComponent(c["기업명"])}">네이버 검색</a>
    <a target="_blank" href="https://map.naver.com/p/search/${encodeURIComponent(b.address)}">네이버 지도</a>
   </div></div>`).join("");
  const warn = b.method.startsWith("회사명") ? `<div class="warn">주소로 못 찾아 회사명으로 찍은 위치예요. 확인이 필요해요.</div>` : "";
  return `<div class="pop">${warn}${cos}</div>`;
}

const namesOf = list => list.map(c => c["기업명"]).join(", ");
BUILDINGS.forEach(b => {
  const names = namesOf(b.companies);
  b.marker = L.marker([b.lat, b.lon], {title:names})
    .bindPopup(popupHtml(b, b.companies), {maxWidth:320, maxHeight:360})
    .bindTooltip(names, {permanent:true, direction:"top", offset:[-15,-12], className:"name-label"});
  b.shownKey = b.companies.map((_, i) => i).join(",");
  b.addrSearch = b.address.toLowerCase();
  b.companies.forEach(c => c.search = [c["기업명"], c["DART 회사명"], c["같은 회사 다른 표기"]].join(" ").toLowerCase());
});

// 필터·검색은 회사 단위로 판단: 같은 건물이라도 조건에 맞는 회사만 세고, 말풍선·이름표·목록에도 그 회사만 보여 줌
function matchedCompanies(b, q, ind, size){
  return b.companies.filter(c => ind.has(c["산업군"]||"미분류") && size.has(c["기업규모"]||"미분류") &&
    (!q || c.search.includes(q) || b.addrSearch.includes(q)));
}

function updateLabels(){
  const show = map.getZoom() >= LABEL_ZOOM;
  BUILDINGS.forEach(b => { const t = b.marker.getTooltip(); if (t) t.setOpacity(show ? 1 : 0); });
}
map.on("zoomend", updateLabels);
cluster.on("animationend", updateLabels);

function chips(el, key){
  const vals = [...new Set(BUILDINGS.flatMap(b => b.companies.map(c => c[key] || "미분류")))].sort();
  el.innerHTML = vals.map(v => `<label><input type="checkbox" checked value="${esc(v)}">${esc(v)}</label>`).join("");
  el.addEventListener("change", render);
}
chips(document.getElementById("fInd"), "산업군");
chips(document.getElementById("fSize"), "기업규모");
const checked = id => new Set([...document.querySelectorAll("#"+id+" input:checked")].map(i => i.value));

function render(){
  const q = document.getElementById("q").value.trim().toLowerCase();
  const ind = checked("fInd"), size = checked("fSize");
  const shown = [];
  BUILDINGS.forEach(b => {
    const list = matchedCompanies(b, q, ind, size);
    if (!list.length) return;
    const key = list.map(c => b.companies.indexOf(c)).join(",");
    if (key !== b.shownKey) {   // 보이는 회사가 바뀐 건물만 말풍선·이름표를 다시 만듦
      b.marker.setPopupContent(popupHtml(b, list));
      b.marker.setTooltipContent(namesOf(list));
      b.shownKey = key;
    }
    b.shown = list;
    shown.push(b);
  });
  cluster.clearLayers(); cluster.addLayers(shown.map(b => b.marker));
  const nCo = shown.reduce((s,b) => s + b.shown.length, 0);
  document.getElementById("count").textContent = `기업 ${nCo}곳 · 건물 ${shown.length}곳 표시 중`;
  document.getElementById("list").innerHTML = shown.map(b =>
    `<li data-id="${esc(b.id)}"><b>${esc(namesOf(b.shown))}</b><small>${esc(b.address)}</small></li>`).join("");
  setTimeout(updateLabels, 50);
}
document.getElementById("q").addEventListener("input", render);
document.getElementById("list").addEventListener("click", e => {
  const li = e.target.closest("li"); if (!li) return;
  const b = BUILDINGS.find(x => x.id === li.dataset.id);
  cluster.zoomToShowLayer(b.marker, () => { b.marker.openPopup(); updateLabels(); });
});
render();
</script></body></html>
